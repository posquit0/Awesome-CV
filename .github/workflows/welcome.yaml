name: Welcome for First Issue or Pull Request

on:
  pull_request_target:
    types:
    - opened
  issues:
    types:
    - opened

permissions: {}

jobs:
  welcome-issue:
    if: github.event_name == 'issues'
    uses: tedilabs/github-actions/.github/workflows/github.issue.welcome.yaml@main
    permissions:
      issues: write
    with:
      runs_on: '"ubuntu-24.04"'
      issue_message: |
        Thanks for your first issue! For a rendering problem, please include a minimal TeX example, the compiler log, and your build environment.
      pr_message: ""
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  welcome-pr:
    if: github.event_name == 'pull_request_target'
    uses: tedilabs/github-actions/.github/workflows/github.issue.welcome.yaml@main
    permissions:
      issues: read
      pull-requests: write
    with:
      runs_on: '"ubuntu-24.04"'
      issue_message: ""
      pr_message: |
        Thanks for your first pull request! Please describe the change and how you checked the generated PDFs.
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
