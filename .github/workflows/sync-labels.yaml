name: Sync labels

on:
  push:
    branches:
    - master
    paths:
    - .github/labels.yaml
    - .github/workflows/sync-labels.yaml
  pull_request:
    paths:
    - .github/labels.yaml
    - .github/workflows/sync-labels.yaml
  workflow_dispatch: {}

permissions: {}

jobs:
  preview:
    if: github.event_name == 'pull_request'
    uses: tedilabs/github-actions/.github/workflows/github.repo.sync-labels.yaml@main
    permissions:
      contents: read
      issues: read
    with:
      runs_on: '"ubuntu-24.04"'
      config_file: .github/labels.yaml
      skip_delete: true
      dry_run: true
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  sync:
    if: github.event_name != 'pull_request'
    uses: tedilabs/github-actions/.github/workflows/github.repo.sync-labels.yaml@main
    permissions:
      contents: read
      issues: write
    with:
      runs_on: '"ubuntu-24.04"'
      config_file: .github/labels.yaml
      skip_delete: true
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
