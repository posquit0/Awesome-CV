name: Label Pull Requests

on:
  pull_request_target: {}

permissions: {}

jobs:
  auto-label:
    uses: tedilabs/github-actions/.github/workflows/github.pr.auto-label.yaml@ab5fbc9e95adfef4fb8a391813222757410dc502
    permissions:
      contents: read
      issues: write
      pull-requests: write
    with:
      runs_on: '"ubuntu-24.04"'
      labeler_config_file: .github/labeler.yaml
      labeler_sync_labels: true
      pr_size_xs_max: 20
      pr_size_s_max: 100
      pr_size_m_max: 500
      pr_size_l_max: 1000
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
