name: Integration

on:
  push:
    branches:
    - master
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yaml:
    name: YAML
    uses: tedilabs/github-actions/.github/workflows/yaml.yamllint.yaml@ab5fbc9e95adfef4fb8a391813222757410dc502
    with:
      runs_on: '"ubuntu-24.04"'
      yamllint_version: "1.38.0"
      yamllint_config_file: .yamllint.yaml
      yamllint_target_dir: ./

  workflows:
    name: GitHub Actions
    uses: tedilabs/github-actions/.github/workflows/github-actions.integration.yaml@ab5fbc9e95adfef4fb8a391813222757410dc502
    with:
      runs_on: '"ubuntu-24.04"'
      actionlint_version: "2.1.0"
      shellcheck_version: "0.11.0"
      check_jsonschema_version: "0.38.2"
      pr_comment_enabled: false
