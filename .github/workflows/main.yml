name: Compile PDFs

on:
  push: {}
  pull_request: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Build TeX environment
      run: docker build --tag awesome-cv .

    - name: Compile
      run: |
        docker run --rm --user "$(id -u):$(id -g)" \
          --volume "$PWD:/doc" awesome-cv

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: examples
        path: build/*.pdf
        if-no-files-found: error
