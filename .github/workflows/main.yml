name: Compile PDFs

on:
  push: {}
  pull_request: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v6

    - name: Install fonts
      run: |
        apt update
        apt install --yes \
          fonts-roboto \
          fonts-adobe-sourcesans3 \
          ;
        fc-cache -fv

    - name: Compile
      run: make

    - uses: actions/upload-artifact@v6
      with:
        name: cv-pdf
        path: compiled/cv.pdf

    - uses: actions/upload-artifact@v6
      with:
        name: resume-pdf
        path: compiled/resume.pdf

    - uses: actions/upload-artifact@v6
      with:
        name: coverletter-pdf
        path: compiled/coverletter.pdf

    - uses: actions/upload-artifact@v6
      with:
        name: compiled
        path: compiled/*.pdf

  release:
    needs: build
    # Only publish a release when changes land on master.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
    - name: Download compiled PDFs
      uses: actions/download-artifact@v6
      with:
        name: compiled
        path: release-files

    - name: Compute release tag
      id: tag
      run: echo "tag=v$(date +'%Y.%m.%d')-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: CV build ${{ steps.tag.outputs.tag }}
        body: |
          Automatically generated from ${{ github.sha }}.

          Download the latest documents:

          - [resume.pdf](https://github.com/${{ github.repository }}/releases/latest/download/resume.pdf)
          - [cv.pdf](https://github.com/${{ github.repository }}/releases/latest/download/cv.pdf)
          - [coverletter.pdf](https://github.com/${{ github.repository }}/releases/latest/download/coverletter.pdf)
        files: release-files/*.pdf
