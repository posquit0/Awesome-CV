name: Compile PDFs

on:
  push: {}
  pull_request: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Build TeX environment
      run: docker build --tag awesome-cv .

    - name: Compile
      run: |
        docker run --rm --user "$(id -u):$(id -g)" \
          --volume "$PWD:/doc" awesome-cv

    - uses: actions/upload-artifact@v7
      with:
        name: examples
        path: build/*.pdf
        if-no-files-found: error
