name: Integration - GitHub Actions

on:
  push:
    branches:
    - master
    paths:
    - ".github/actions/**"
    - ".github/workflows/**"
    - ".github/actionlint.yaml"
    - ".github/jactionlint.yaml"
  pull_request:
    paths:
    - ".github/actions/**"
    - ".github/workflows/**"
    - ".github/actionlint.yaml"
    - ".github/jactionlint.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: integration-github-actions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration
    uses: tedilabs/github-actions/.github/workflows/github-actions.integration.yaml@main
    with:
      runs_on: '"ubuntu-24.04"'
      actionlint_version: "2.1.0"
      shellcheck_version: "0.11.0"
      check_jsonschema_version: "0.38.2"
      pr_comment_enabled: false
